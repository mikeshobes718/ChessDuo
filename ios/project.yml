name: ChessCoach
options:
  bundleIdPrefix: com.mikeshobes
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: N7LRRN2YGY
targets:
  ChessCoach:
    type: application
    platform: iOS
    sources:
      - path: ChessCoach
    info:
      path: ChessCoach/Info.plist
      properties:
        API_GAME_URL: "https://kcdlmmfzeksjqwdppjzy.supabase.co/functions/v1/game"
        CFBundleDisplayName: "Chess Duo"
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "26"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.mikeshobes.chesscoachduo.room
            CFBundleURLSchemes:
              - chessduo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeshobes.chesscoachduo
        PRODUCT_NAME: ChessCoach
        DEVELOPMENT_TEAM: N7LRRN2YGY
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: 26
        CODE_SIGN_ENTITLEMENTS: ChessCoach/ChessCoach.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # Helps Xcode-beta when swift-plugin-server returns malformed State macro responses.
        OTHER_SWIFT_FLAGS: >-
          $(inherited)
          -plugin-path $(DEVELOPER_DIR)/Platforms/iPhoneOS.platform/Developer/usr/lib/swift/host/plugins
          -external-plugin-path $(DEVELOPER_DIR)/Platforms/iPhoneOS.platform/Developer/usr/lib/swift/host/plugins#$(DEVELOPER_DIR)/Platforms/iPhoneOS.platform/Developer/usr/bin/swift-plugin-server
    scheme:
      testTargets: []
