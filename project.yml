name: ChessDuo
options:
  bundleIdPrefix: com.mikeshobes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: N7LRRN2YGY
targets:
  ChessDuo:
    type: application
    platform: iOS
    sources:
      - path: ChessDuo
    info:
      path: ChessDuo/Info.plist
      properties:
        API_GAME_URL: "https://api.atberth.com/v1/apps/chessduo/functions/game"
        # Berth publishable key: safe to ship, it can only call the game function.
        API_PUBLISHABLE_KEY: "bpk_0iJVm1fvX7TyC8x7RKs6huaDEAJSI5vK-DuIoESR9Jk"
        # Optional accounts: end-user auth and owner-only tables of the same app.
        ACCOUNT_API_URL: "https://api.atberth.com/v1/apps/chessduo"
        GOOGLE_IOS_CLIENT_ID: "GOOGLE_CLIENT_ID_PENDING"
        CFBundleDisplayName: "Chess Duo"
        CFBundleShortVersionString: "2.1"
        CFBundleVersion: "41"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.mikeshobes.chesscoachduo.room
            CFBundleURLSchemes:
              - chessduo
        CFBundleLocalizations:
          - en
          - pt
          - es
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeshobes.chesscoachduo
        PRODUCT_NAME: ChessDuo
        DEVELOPMENT_TEAM: N7LRRN2YGY
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: 41
        CODE_SIGN_ENTITLEMENTS: ChessDuo/ChessDuo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      testTargets:
        - ChessDuoUITests
  ChessDuoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChessDuoUITests
    dependencies:
      - target: ChessDuo
    settings:
      base:
        DEVELOPMENT_TEAM: N7LRRN2YGY
        TEST_TARGET_NAME: ChessDuo
        GENERATE_INFOPLIST_FILE: YES
